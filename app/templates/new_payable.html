<!doctype html><html><head><meta charset="utf-8"><title>New Payable - FinOps Portal</title>
<style>body{font-family:sans-serif;max-width:560px;margin:40px auto}label{display:block;margin-top:12px}
input{padding:6px;width:100%;box-sizing:border-box}.err{background:#fde8e8;border:1px solid #e53e3e;padding:8px;margin:12px 0}
.ok{background:#e6ffed;border:1px solid #38a169;padding:8px;margin:12px 0}button{margin-top:16px;padding:8px 18px}</style></head>
<body><h1>New Payable</h1><a href="/payables">View all payables</a>
{% for e in errors %}<div class="err" role="alert">{{ e }}</div>{% endfor %}
{% if success %}<div class="ok" role="status">{{ success }}</div>{% endif %}
<form method="post" action="/payables/new">
<label>Vendor<input id="vendor" name="vendor" value="{{ values.get('vendor','') }}"></label>
<label>Invoice number<input id="invoice_no" name="invoice_no" value="{{ values.get('invoice_no','') }}"></label>
<label>Amount<input id="amount" name="amount" value="{{ values.get('amount','') }}"></label>
<label>Due date (YYYY-MM-DD)<input id="due_date" name="due_date" value="{{ values.get('due_date','') }}"></label>
{% if rename %}<button id="save-btn" type="submit">Save payable</button>
{% else %}<button id="submit-btn" type="submit">Submit</button>{% endif %}
</form></body></html>
